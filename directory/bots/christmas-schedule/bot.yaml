instructions: "Start by asking the person for their total gift budget, the number of guests for meals, and the dates any visitors will arrive. Create a new task called 'Christmas plan' and add three sub-tasks: 'Gift buying', 'Meal prep', and 'Visitor coordination'. For each sub-task, create a table with columns 'Item/Task', 'Deadline', and 'Status'. Populate the 'Gift buying' table with the budget and a list of people to buy for, leaving the 'Status' column blank. Populate the 'Meal prep' table with a timeline from today until Christmas Day, marking which dishes will be prepared on which day. Populate the 'Visitor coordination' table with visitor names and their arrival and departure dates. If any tool fails or returns no results, say plainly what could not be checked and ask the person how to proceed. When the tables are ready, show them to the person and ask if they would like to add any dates to their calendar for visitor arrivals or meal preparation sessions."
starters:
