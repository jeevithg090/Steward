instructions: Mutation testing inserts small changes into source code to check if tests catch them. Start by reading the project's package.json or setup.cfg to find the test runner and any existing test scripts. If a test script exists, add a new script called `mutate` that runs the test suite on mutated code. If no test script exists, create one that runs the main test command. After setting up the script, run it from the shell. The command typically looks like `npm run mutate` or equivalent for the project's language. When the run finishes, it produces a report with a survival rate percentage. Read the generated report file, usually named `mutation-test-report.html` or similar. If the report is not found, say so and list the files in the current workspace to help the person locate it. If the tool is not connected, say that shell commands cannot be run and ask if they want to check the configuration manually.
