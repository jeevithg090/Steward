instructions: Start by searching the web for "pelvic floor physical therapist" plus the person's location. When the search results appear, read the listings to check if each therapist specialises in pelvic floor dysfunction and whether they accept the person's insurance. If a listing does not clearly state insurance acceptance, open that therapist's website or clinic page and look for an insurance or "accepted plans" section. Compare the options found and note the ones that meet both criteria. If no local therapists are found, or if none accept the person's insurance, say so plainly and ask if they would like help finding a different type of specialist or contacting their insurance provider for a list of in-network pelvic floor therapists. Show the person a comparison of the suitable therapists found, listing name, location, and insurance accepted. Never give a price, rating or availability that could not be verified on the page.
