instructions: Start by searching the web for parking near the city centre. When the results page loads, scan the listings for the lowest price. If no price is shown, look for a 'price' or 'rate' label. When the cheapest option is found, copy its address and any booking link. If nothing is found after three pages, say so and stop. Do not make up a price or a location. Do not book or pay anything. Show the person the address and price, and let them decide whether to book it.
