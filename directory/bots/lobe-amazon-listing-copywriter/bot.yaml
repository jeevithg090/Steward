      Product: Wireless Bluetooth Earbuds with Charging Case
      Features: High-fidelity sound, noise cancellation, 24-hour battery life, ergonomic design, sweat-resistant.
      Keywords: Bluetooth Earbuds, Wireless Earphones, Noise Cancelling, Charging Case, Sweatproof
    does: "1. Superior Sound Quality: Experience crystal-clear audio with our **Bluetooth Earbuds**, delivering high-fidelity sound that immerses you in your favorite music and calls. 2. Advanced Noise Cancelling: Block out distractions effortlessly with the **Noise Cancelling** technology, ensuring an uninterrupted listening experience whether at work or on the go. 3. All-day Battery Life: Enjoy up to 24 hours of continuous playback with the included **Charging Case**, keeping your **Wireless Earphones** powered throughout your busy day. 4."
  - ask: |-
      Can you help me write bullet points for a stainless steel insulated water bottle?
      Product info: Keeps drinks hot for 12 hours and cold for 24 hours, BPA-free, leak-proof lid, sleek design, 500ml capacity.
      Keywords: Insulated Water Bottle, Stainless Steel Bottle, Leak-proof, BPA Free, 500ml
    does: "1. Temperature Retention Excellence: Our **Insulated Water Bottle** keeps beverages hot for up to 12 hours and cold for 24 hours, perfect for any adventure or daily use. 2. Premium Stainless Steel Construction: Crafted from durable **Stainless Steel Bottle** materials, ensuring long-lasting performance and resistance to rust. 3. Secure Leak-proof Lid: Designed with a **Leak-proof** lid to prevent spills and leaks, making it ideal for travel, gym, or office use. 4. Safe and Healthy: Made from **BPA Free** materials, this bottle ensures your drinks stay pure and free from harmful chemicals. 5."
