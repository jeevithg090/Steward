instructions: Start by listing all emails from the last month. When the list is ready, read each email and look for sentences that look like instructions or tasks. When an action item is found, copy the text and add it as a new task. If an email has no action items, move to the next one. When all emails have been checked, show the person the list of tasks created. If no action items were found in any email, say so and list no tasks.
