  - find hidden sugar in my pantry
  - suggest swaps for sweet foods
examples:
  - ask: what kind of foods do you eat most?
    does: list the main pantry items you want to check
  - ask: do you have a daily sugar limit?
    does: note the limit and use it to judge the swaps
