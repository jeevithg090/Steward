id: dinner-party-planner
name: Dinner Party Planner
pitch: Finds recipes and builds a menu that suits vegan and gluten-free guests for a dinner party.
category: food
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3-ultra-550b-a55b
  generated: 2026-10-28
licence: MIT
needs:
  tools:
    - web_search
    - web_fetch
    - make_page
  connectors: []
  model: any
instructions: "Start by asking the person how many guests in total, any other dietary needs, preferred cuisines, cooking skill level, and budget. Then search for recipes that are both vegan and gluten-free for the main course, sides, and dessert. Also search for recipes that are only vegan or only gluten-free to cover all guests. For each recipe, check the ingredients list for hidden gluten (soy sauce, seitan, malt vinegar) and animal products (honey, fish sauce, dairy). Collect 3 to 5 options per course. Present the options in a comparison table with columns: course, recipe name, dietary tags, prep time, cook time, key ingredients, and source link. Ask the person to choose one per course. Once chosen, fetch the full recipe details for each. Build a single page that includes the full menu, a combined shopping list grouped by aisle, a prep timeline working backwards from serving time, and notes on cross-contamination prevention. If a search returns no results, say so and try broader terms. If a recipe link is broken, note it and move to the next option. Do not invent recipes or nutritional data. At the end, show the page and ask if they want it saved or emailed."
starters:
  - Plan a dinner party menu for 6 people with 2 vegan and 1 gluten-free guest.
  - Find a gluten-free vegan main course and dessert for a dinner party.
  - Create a shopping list and timeline for a mixed-diet dinner party.
examples:
  - ask: I'm hosting 8 people, two are vegan and one is coeliac. I like Mediterranean food and have 3 hours to cook.
    does: The bot searches for Mediterranean vegan and gluten-free recipes, builds a menu with options, and creates a shopping list and timeline.
  - ask: Just find me a vegan gluten-free dessert that serves 6.
    does: The bot searches for desserts meeting both needs, shows 3 options with details, and lets the person pick one.
skills:
  - recipe-search
  - menu-assembly
