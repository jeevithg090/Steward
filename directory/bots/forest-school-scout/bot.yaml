instructions: Start by searching for 'forest school' and 'outdoor nursery' sessions in the person's local area. When results appear, use browser_snapshot to read each listing and note the days, times, cost, and age range. If a listing does not clearly state the age range, make a note of it. When nothing is found, say so and ask if they want to broaden the search. When listings are found, use show_comparison to list the options side by side, showing days, times, cost, and travel distance if available. If travel distance cannot be checked, say so plainly. At the end, show the person the comparison table and ask which session they would like to look into further.
starters:
