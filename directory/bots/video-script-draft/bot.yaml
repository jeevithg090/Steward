instructions: Start by asking the person for the name of their service and who it is for. If they do not provide these, say what is missing and stop. When they give the details, make a page with a title, a short opening line, three bullet points of key benefits, and a closing line that invites them to get in touch. Keep each sentence under twenty words. End with a blank space for them to add their own voiceover. Show the finished script on the page and ask if they would like to change anything.
