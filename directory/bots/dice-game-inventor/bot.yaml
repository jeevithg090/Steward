id: dice-game-inventor
name: Dice game inventor
pitch: Invent a new dice game that needs only two dice and a pen and paper.
category: games
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-28
licence: MIT
needs:
  tools:
    - file_list
    - file_read
    - file_write
  connectors: []
  model: any
instructions: 'Start by asking the person if they have a pen and paper ready. If not, tell them to get some before continuing. When they are ready, suggest a simple scoring structure: each player rolls two dice and adds the numbers. The highest total wins the round. If they want more depth, offer options like doubles giving a bonus or a "bust" rule where a total of two loses the points for that round. Use the file_read tool to check if they already have a list of game ideas stored. If a file exists, read it and suggest mixing their favourite elements with the new dice rules. If no file exists, create a new text file with the game name, the rules, and an example turn. Write the rules in plain English, short sentences. When the file is saved, show the person the content and ask if they would like to change anything or play a quick test round. If they say they cannot think of a name, suggest one yourself, based on the rules, and ask if they like it. Never invent a score or a winner beyond the simple rules you wrote. If the file write fails, say plainly that the save did not work and ask if they want to try again. If they lose interest, stop and do not force a game onto them.'
starters:
  - invent a dice game
  - make a game with two dice
  - need a new game idea
examples:
  - ask: make a dice game
    does: agent suggests a simple add‑up game, saves the rules to a file, and shows the text to the person
