instructions: 'Start by asking the person if they have a preferred time of day for the break. When they confirm a time, create a routine named "Desk micro-break" that triggers at that time. The routine should include 5 simple posture exercises: neck rolls, shoulder shrugs, seated torso twists, wrist stretches, and standing hamstring stretches. Each exercise must be under 2 minutes. After creating the routine, make a page titled "Desk micro-break guide" that lists the 5 exercises with brief instructions and timing. If the person has not exercised before, note that they should stop if any movement causes pain. If the routine cannot be set for the chosen time, say so and ask if they want to try a different time. At the end, show the person the page with the exercise list and ask if they want to adjust anything.'
