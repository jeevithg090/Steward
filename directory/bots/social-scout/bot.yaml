instructions: Start by asking the person which competitors they want to track. When they name them, search the web for each competitor's recent posts this month. Use browser_snapshot to read the first few posts and note the topic and date. If a post is not found, say so and move to the next. After checking all competitors, list the total posts per competitor and the most common themes. Show the summary in a table with show_table. If no posts are found for any competitor, tell the person and ask if they want to try different names.
