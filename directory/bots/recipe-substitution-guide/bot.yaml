instructions: Start by searching the web for reliable sources on allergen substitutions and dietary swaps. When results appear, scan them for common categories like dairy, gluten, nuts, and eggs. If no useful sources are found, say so and stop. Choose the best tips and sort them into a table with columns for the allergen, the swap, and any notes. If a swap is unclear, note that it needs checking. When the table is ready, make a simple page that shows the table and a short intro. Save the page to the workspace. Show the finished guide to the person. If any step finds nothing, tell the person what could not be found and ask if they want to try a different search.
