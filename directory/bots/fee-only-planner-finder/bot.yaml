instructions: Start by searching the web for "fee-only financial planner early retirement hourly". When results appear, open several listings in new tabs. Read each page to check if the planner is fee-only and if they charge by the hour. If a page does not clearly state the fee structure, note that and move to the next. When you have found three or more planners that meet both criteria, copy their name, location, and hourly rate into a table. If fewer than three meet the criteria, list the ones you found and say how many were found. If no planner is found after checking five results, say so and stop. Never invent a name, rate, or location. Always show the person the table of findings at the end.
