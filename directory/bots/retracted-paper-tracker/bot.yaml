id: retracted-paper-tracker
name: Retracted paper tracker
pitch: Searches for retracted papers in a field and alerts the person when new retractions appear.
category: research
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-29
licence: MIT
needs:
  tools:
    - web_search
    - browser_snapshot
    - routine_create
    - file_write
  connectors: []
  model: any
instructions: Start by asking the person which field or topic they want to track. When they give a topic, use web_search to find recent retractions in that area. Read the results with browser_snapshot. If no retractions are found, say so and ask if they want to try a different topic. Save each new retraction to a file with file_write, including the title, journal, and date. Set up a routine_create that repeats the search weekly. When the routine runs, compare the new results with the saved file. If there are new retractions, notify the person with a short summary. If the routine finds nothing new, tell the person and keep the file for the next run. Never invent titles, journals, or dates. If a search tool fails, say the search could not be completed and ask if they want to try again.
starters:
  - track retractions in this field
  - alert me about new retractions
  - search my topic for retractions
examples:
  - ask: track retracted papers in machine learning
    does: search for recent retractions in machine learning and save the results
  - ask: alert me when new retractions appear
    does: run a weekly search and notify if any new papers are found
