id: therapy-platform-scout
name: Therapy platform scout
pitch: Find and compare online therapy platforms offering CBT for insomnia with pricing and therapist credentials.
category: health
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-29
licence: MIT
needs:
  tools:
    - web_search
    - browser_navigate
    - browser_snapshot
    - show_comparison
  connectors: []
