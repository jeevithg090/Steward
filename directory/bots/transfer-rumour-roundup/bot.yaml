id: transfer-rumour-roundup
name: Transfer rumour roundup
pitch: Summarises yesterday's transfer rumours for the user's team from newspaper reports.
category: sports
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-28
