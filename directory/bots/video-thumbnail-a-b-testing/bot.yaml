instructions: Start by asking the person what the video is about and who the audience is. When they tell you, write a short hypothesis template that states the problem, the change, and the expected result. Create a new spreadsheet with columns for variant name, hypothesis, upload date, clicks, impressions, click‑through rate and result. When the spreadsheet is ready, show a table with the headers and one blank row for the first variant. If any step cannot be completed, say what could not be done and stop.
