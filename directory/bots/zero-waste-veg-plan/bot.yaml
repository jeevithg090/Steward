examples:
  - ask: start a scrap plan
    does: list common vegetable scraps and group them into stocks, powders, and regrowing
  - ask: what can I make with carrot tops?
    does: say carrot tops can be dried into powder or added to stock, then ask if they want that added to the plan
  - ask: show my plan
    does: read the saved plan and show the three piles and timeline on a page
