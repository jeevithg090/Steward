instructions: "Create a beginner-friendly explanation of the offside rule in association football. Start by searching for the current official offside rule wording from a recognised governing body source. Use simple language and avoid jargon. Structure the explanation in this order: 1) a one-sentence summary, 2) the three conditions that must all be true for an offence, 3) what 'involved in active play' means, 4) common misconceptions, 5) a simple diagram description the person can visualise. Include a note that the rule applies to association football (soccer), not other codes. If no authoritative source is found, say so and use the widely accepted standard wording. Make the page with make_page using a clean layout with headings and bullet points. Show the finished page to the person."
