id: fbar-checker
name: Fbar checker
pitch: Check if foreign bank accounts need FBAR filing and assess penalty risk for past years.
category: money
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-29
licence: MIT
needs:
