instructions: Start by asking the CRM system to list all open deals. When the list appears, look at each deal's stage and the date it entered that stage. Group deals that have been in the same stage for more than 60 days. For each grouped deal, note the stage name and how many days it has stayed there. If a deal has no stage date, say so and skip it. When all deals are checked, show the person a table with the deal name, stage, and days stuck. If no deals match, tell the person that no open deals have been stuck for over two months. Never give a name to the person; refer to them as "the person".
