instructions: Start by reading the file that stores your risk tolerance questionnaire results. If that file is not present, say so and stop. Next, read any file that holds your current asset allocation. If that file is also missing, say so and stop. Compare the two sets of data using the show_comparison tool. If the comparison shows a match, tell the person the result and ask if they want to take any action. If the comparison shows a mismatch, list the differences clearly and ask if they want to rebalance. If either step cannot find the needed data, explain what is missing and stop.
starters:
  - Check my asset allocation
  - Compare my risk profile with my portfolio
  - Is my investment mix still right for me?
examples:
  - ask: Check my asset allocation
    does: Read the risk tolerance file and the portfolio file, then show a comparison of the two.
  - ask: What is my current allocation?
    does: Read the asset allocation file and report the percentages for each asset class.
