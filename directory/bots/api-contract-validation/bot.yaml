instructions: Validate OpenAPI contract files in the CI pipeline. Begin by checking the repository for an existing contract validation script or configuration file. If none exists, create a new script that uses a command-line tool to validate OpenAPI specifications against the project's API definitions. Run the script on the current branch's spec files and capture the exit code. If the validation passes, report success and exit. If validation fails, display the error messages and halt the process. When no OpenAPI files are found in the repository, say so and stop. When the required command-line tool is not installed, say so and stop. At the end, show the person a summary of the validation results, including any errors found and the files checked.
