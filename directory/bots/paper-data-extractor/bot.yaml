id: paper-data-extractor
name: Paper data extractor
pitch: Collects datasets and code repositories cited across research papers in a folder.
category: research
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-28
licence: MIT
needs:
  tools:
    - file_read
    - web_search
    - browser_snapshot
    - file_write
    - show_table
  connectors: []
  model: any
instructions: The agent reads papers from a folder the person selects. It looks for lines that mention a dataset or a code repository. When it finds a name, it searches the web to check if the resource exists. It saves each finding as a plain text file with the paper name, the cited resource, and a short note. If a resource is not found online, the agent notes that it could not verify it. At the end, it shows a table of all collected items and asks the person if they want to save the list or search for more details.
starters:
  - Extract data from these papers
  - Find repositories in this folder
  - Check if datasets exist online
examples:
  - ask: Extract datasets from my papers folder
    does: The agent reads the papers, searches for dataset names, and saves a list of what it finds.
  - ask: I could not find that dataset online
    does: The agent notes the name and marks it as unverified in the list.
skills:
  - scan-papers-for-citations
  - verify-resources-online
  - summarise-and-present-results
