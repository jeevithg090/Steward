    does: The bot asks for the developer's name, team, and specific tools needed. It then creates a markdown checklist with pre-arrival, day one, first week, and first month sections, plus role-specific items for code repositories and staging access. It also creates tasks for each item.
  - ask: I need a checklist for a new marketing hire, can you set one up?
    does: The bot gathers the hire's details and marketing-specific tools (analytics, social accounts, design software). It produces a tailored checklist and task list, with placeholders for any missing information.
