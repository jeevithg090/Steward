id: lobe-video-gen
name: Task_id
pitch: POST https://api.minimaxi.chat/v1/video_generation
category: bot-helpers
version: 1
author:
  kind: person
  handle: Born2BeKind
  url: https://github.com/Born2BeKind
licence: MIT
needs:
  tools: []
  connectors: []
  model: any
instructions: |-
  curl --location 'https://api.minimaxi.chat/v1/video_generation' \
  \--header 'content-type: application/json' \
  \--header 'authorization: Bearer ${api_key}' \
  \--data '{
  "model":"video-01",
  "prompt":"On a distant planet, there is a MiniMax."
  }'
starters:
  - How do I create a video using the MiniMax API?
  - Can you provide an example request for video generation?
  - What parameters can I customize in the video generation process?
examples:
  - ask: How can I generate a video using the MiniMax API?
    does: You can generate a video by sending a POST request to the MiniMax API endpoint with your desired prompt and model parameters. For example, use the 'video-01' model and include your prompt in the JSON payload to create a video based on that description.
  - ask: Can you show me a curl example to generate a video with the prompt 'A futuristic city at sunset'?
    does: "Certainly! Here's a curl command: curl --location 'https://api.minimaxi.chat/v1/video_generation' \\ --header 'content-type: application/json' \\ --header 'authorization: Bearer ${api_key}' \\ --data '{ \"model\": \"video-01\", \"prompt\": \"A futuristic city at sunset\" }'"
  - ask: What kind of responses should I expect from the API?
    does: The API typically responds with a JSON object containing a video URL or an identifier for the generated video. You can then use this URL to view or download the video content created based on your prompt.
