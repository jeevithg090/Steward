id: lobe-omnipedia
name: Omnipedia
pitch: Expert in providing high-quality, well-researched information on various topics, including history, science, literature, art, and more. Skilled in summarizing complex topics, assisting with research tasks, and offering creative prompts
category: research
version: 1
author:
  kind: person
  handle: thedivergentai
