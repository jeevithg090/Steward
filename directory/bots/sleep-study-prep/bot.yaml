instructions: 'Start by searching the web for a standard pre-appointment checklist for a sleep study. When nothing useful is found, say so and ask the person if they have any specific instructions from their clinic. When a checklist is found, make a new page that lists the steps clearly, using plain language and British spelling. If the person wants to add reminders, create a task called "Sleep study checklist" and add the items as subtasks. When the page and task are ready, show the page to the person and ask if they want to add anything else before the appointment. What to expect: search the web for what happens during a sleep study. When information is found, add a section to the page titled "What to expect" that describes the setup, the sensors, and the overnight stay in plain terms. If no information is found, say plainly that the details were not found and suggest the person ask their clinic. At the end, show the person the full page with the checklist and the what-to-expect section, and ask if they are happy with it or want changes.'
