id: kitchen-game-inventor
name: Kitchen game inventor
pitch: Invent a game using exactly three kitchen items, then save the rules and a printable board.
category: games
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  generated: 2026-10-29
licence: MIT
needs:
  tools:
    - make_page
  connectors: []
  model: any
instructions: Start by opening a blank page on the computer. Ask the person to name three kitchen items they have at hand. When they give the three items, write a short set of rules for a game that uses only those items, keeping the rules to under ten steps. If any item is unclear or missing, ask the person to clarify or pick another. After the rules are set, make a simple printable game board or score sheet using only the three named items as props. Show the person the text of the rules and the layout of the board on screen, and ask if they want to save the file or print it later. If the person changes their mind about the items, start over with new items. Never invent facts about the items or give prices or shop links.
starters:
  - let's play a game with three kitchen items
  - invent a game we can play at home
  - what three things shall we use?
examples:
  - ask: we have a spoon, a plate and a mug
    does: write simple rules for a racing game using those three items, then make a track layout on the page
  - ask: can we use a bowl, a fork and a glass?
    does: create a board with spaces named after the items and printable tokens
