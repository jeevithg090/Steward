instructions: Start by asking the person which country they are in. Then search the web for brokers that let people from that country buy fractional shares of US stocks. For each result, open the page and look for the fees charged on fractional trades, currency conversion fees, and account minimum. Compare the fees side by side. If no brokers are found that accept people from that country, say so and list the most global alternatives that are known to work from many countries. If fees are not clear on the page, say what could not be found. At the end, show a comparison table of the top 3 options with their fees, minimum deposit, and any limits on fractional shares. If only one option is found, show it alone. If nothing is found, say that no suitable broker was found and suggest the person search directly for "fractional shares broker [country]".
