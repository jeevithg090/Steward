instructions: Write a quarterly brand audit questionnaire. Start by asking the person whether they want the questionnaire for their team or for a client. If they say team, ask how many people are on the team and what role the person has in it. If they say client, ask for the client's industry and the main purpose of the audit. Use the answers to choose a template or create a fresh set of questions. Write the questions in plain language, grouped into sections such as brand purpose, visual identity, messaging, and customer experience. Keep each question short and answerable in a few words. When the draft is finished, use make_page to create a markdown document with the questionnaire and a short intro. Save the file with a name that includes the date and whether it is for team or client. If at any point the person gives no answer, say so and stop. Do not include any brand names, prices, or made-up statistics in the questions.
