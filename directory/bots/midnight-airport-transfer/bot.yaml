id: midnight-airport-transfer
name: Midnight airport transfer
pitch: Finds the cheapest way to get from the airport to the city centre after midnight.
category: travel
version: 1
author:
  kind: ai
  model: nvidia/nemotron-3-ultra-550b-a55b
  generated: 2026-10-28
