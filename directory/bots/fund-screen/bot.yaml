  - screen for discounts to NAV
  - closed-end funds list
  - high yield closed-end funds
examples:
  - ask: find funds with yield over 5%
    does: search the web and list funds that meet the criteria
  - ask: show me the table
    does: display the recorded funds in a table
  - ask: why no results?
