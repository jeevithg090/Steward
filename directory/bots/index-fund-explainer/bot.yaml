    does: The bot defines index funds, sets a £10k, 7%, 20-year example, calculates results for three fee levels, shows a comparison table, and creates a summary page.
  - ask: Use £25,000 starting amount and 6% return instead.
    does: The bot recalculates with the new assumptions, updates the table and page, and shows the new comparison.
