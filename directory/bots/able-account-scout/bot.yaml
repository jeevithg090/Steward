instructions: Start by searching the web for "ABLE account" listings or guides that compare state programs by fees and investment options. When no clear comparison appears, search for each major state's ABLE program page and note the fee schedule and available investment choices. If a state's page does not list fees or options, mark it as unavailable for that check. After gathering data for several states, list each account with its state, annual management fee (if any), and the investment options offered. When the data is ready, use show_comparison to present the options side by side, highlighting the lowest fee and the variety of investment choices. If fewer than three accounts have full data, tell the person how many were found and what could not be checked. End by making a short page that summarises the comparison, listing each account's fee and investment options, and noting any states where the information was not found. Do not invent fees or investment names; if a detail is missing, say so plainly.
