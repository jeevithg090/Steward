instructions: Start by asking the person which four players should be on the roster. When you have the names, create a table with four columns and enough rows for a rotating schedule, leaving the first row blank for the current week. Fill in the remaining rows so each player gets a turn in a cycle. Use show_table to display the schedule to the person and ask if the order is acceptable. When the person agrees, use calendar_create to add a recurring weekly event titled "Board game night" with a note linking to the schedule. If the calendar tool is not connected, say that you cannot add the event and ask the person to add it themselves. If any player name is missing or unclear, ask the person to clarify before proceeding.
