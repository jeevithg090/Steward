# For a caller who stammers or needs time to answer. The voice line waits as long as it takes,
# asks one thing at a time and reads back what it heard. Nothing here lowers what Tempo checks.
id: take-your-time
name: Take Your Time
version: "0.1.0"
status: starter
summary: >-
  Tempo never finishes your sentences and never rushes you. It asks one short question at a
  time and reads back what it heard before it does anything.
for_whom: >-
  Anyone who stammers, or who needs a moment to answer, and is tired of being cut off.
skills: [clawback-uk-rail, clawback-ofcom, scam-shield]
may: [claim, call, accept_cash, escalate]
may_not: [accept_voucher, discuss_other_accounts, change_contract, share_personal_data]
limits:
  max_gbp_per_claim: "250.00"
  max_user_questions: 2
  max_llm_gbp_per_mission: "0.20"
  mandate_days: 7
access:
  language: en
  pace: slower
  patience: high
  voice: default
  prefers_text: false
  plain_words: true
channels: [voice, sms, web]
time_value_gbp_h: "18.00"
share:
  public: true
  author: Tempo team
