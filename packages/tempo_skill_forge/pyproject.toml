[project]
name = "tempo-skill-forge"
version = "0.1.0"
description = "Tempo Skill Forge: Generative skill creation with formal specifications"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tempo-core",
    "tempo-ports",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "hypothesis>=6.92",
    "mcp>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
tempo-core = { workspace = true }
tempo-ports = { workspace = true }
