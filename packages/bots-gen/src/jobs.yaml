# The taxonomy: jobs people actually ask for, one list per category (keys from BOT_CATEGORIES).
# Each line is written the way a person would say it. `tools` is a hint to the generator from the
# built-in catalogue (never request_secret, never show_* except show_table and show_comparison);
# `connectors` is mail, calendar or left out. No brands, no personal names.

food:
  - job: plan a week of dinners for four that take under half an hour each
    tools: [web_search, web_fetch, make_page, show_table]
  - job: turn what is in my fridge into three meals before it goes off
    tools: [make_page]
  - job: write a shopping list from these recipes and group it by aisle
    tools: [web_fetch, make_page, show_table]
  - job: find a recipe that uses up a glut of courgettes
