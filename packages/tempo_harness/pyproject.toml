[project]
name = "tempo-harness"
version = "0.1.0"
description = "Tempo harness: policies, hooks adapter, middleware, budgets"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tempo-core",
    "tempo-passport",
    "agent-framework-core>=1.23",
    "agent-hooks-sdk>=0.1.0b3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
