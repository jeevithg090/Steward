[project]
name = "tempo-memory"
version = "0.1.0"
description = "Tempo Memory: Memory Gate, context provider and stores"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tempo-core",
    "tempo-ports",
    "agent-framework-core>=1.23",
    "mem0ai>=2.2.1",
    "graphiti-core>=0.30.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3",  # Mem0's pgvector store
    "psycopg-pool>=3.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=25.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
