[project]
name = "tempo-passport"
version = "0.1.0"
description = "Tempo Agent Passport: signed mandates that any party can verify offline"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14", "webauthn>=3.0.1", "cryptography>=46"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
