[project]
name = "tempo-crypto"
version = "0.1.0"
description = "Tempo crypto: envelope encryption, key wrapping, worker identity"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pynacl>=1.6.2", "cryptography>=46"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
