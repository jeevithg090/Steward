# Typecheck, lint, build, unit tests, the triage rules and end-to-end tests on every push to main
# and every pull request, on the oldest and newest Node versions Steward supports. Everything runs
# with the scripted model and the demo inbox, so CI needs no secrets and sends nothing to any model
# provider.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No version here: the action reads it from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium comes before the unit tests: the computer's tests start a real browser.
      # The cache is keyed on Playwright's own version, so a dependency bump elsewhere keeps it.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser came from the cache, but the system libraries it needs did not.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Every package, and the end-to-end specs.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build the web app and the phone app
        run: pnpm build && pnpm --filter @steward/web build:phone

      # In a random order, so a test that passes only after another one fails here. To repeat a
      # failure, run `pnpm test --sequence.shuffle --sequence.seed=<the seed in this step's name>`.
      - name: Unit tests (seed ${{ github.run_id }})
        run: pnpm test --sequence.shuffle --sequence.seed=${{ github.run_id }}

      - name: Triage rules agree with the labelled mail
        run: pnpm eval:triage --rules-only

      # With CI set, this also runs the "built" project: a few specs against the production build
      # from the step above, served by the Steward server with its real headers.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 14
          if-no-files-found: ignore
