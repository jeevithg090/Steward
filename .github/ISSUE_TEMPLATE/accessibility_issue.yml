name: Accessibility issue
description: Something that is hard to hear, read, reach or operate, on the phone, by text or on the web.
title: "a11y: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Tempo is meant to be reachable by landline and SMS, patient by default, and usable with a
        screen reader, a keyboard, large text and reduced motion ([docs/accessibility.md](../blob/main/docs/accessibility.md)).
        If it fell short for you or someone you help, please say how. Accessibility issues are
        treated as bugs, not feature requests.
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      multiple: true
      options:
        - Voice (the phone line)
        - SMS
        - Web (Mission Control, the showcase, profiles pages)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What you were trying to do and what stopped you. If Tempo said something, quote it.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of barrier
      multiple: true
      options:
        - Too fast, or it cut me off (pace, turn-taking, timeouts)
        - Hard to hear (voice pitch, volume, speed, no text alternative)
        - Hard to understand (jargon, long sentences, the wrong language)
        - Hard to see (text size, contrast, motion, colour alone carrying meaning)
        - Keyboard or screen reader (focus, labels, landmarks, live updates)
        - Touch or pointer (targets too small, drag-only, timing)
        - Something else
    validations:
      required: true
  - type: input
    id: tech
    attributes:
      label: Assistive technology, browser or phone
      description: For the web, the screen reader and browser; for voice, landline or mobile and anything about the line.
      placeholder: VoiceOver + Safari on iPhone; or NVDA + Firefox; or a landline
  - type: input
    id: wcag
    attributes:
      label: WCAG criterion, if you know it
      description: Optional, e.g. 1.4.4 Resize text, 2.4.1 Bypass blocks, 2.5.8 Target size.
  - type: textarea
    id: fix
    attributes:
      label: What would have worked
      description: If you know what would have made it work for you, say so. It usually becomes the fix.
