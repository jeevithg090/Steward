name: Bug report
description: Something Tempo did, said or showed that it should not have.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a security problem (Tempo acting without consent, a
        leak, a bypassed signature), **do not file it here**: use the private channel in
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What Tempo did, and what you expected instead. Quote what it said if you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps, commands or pages. Replay mode (`TEMPO_MODE=replay`, the default) needs no keys.
      placeholder: |
        1. make setup
        2. make demo-dry-run
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Web (Mission Control, the showcase, profiles pages)
        - Voice (the ElevenLabs line)
        - SMS
        - Gateway API
        - A skill or rule pack
        - A profile
        - Memory
        - Mesh (pairing, passkeys, push)
        - Docs
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode and version
      description: "`TEMPO_MODE`, `TEMPO_DEPLOY`, the commit or tag, and the honesty badge text if the web app showed one."
      placeholder: "replay, cloud-standard, main @ abc1234, badge: REPLAY data · SIMULATED COMPANY"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the relevant lines. Tempo's logs carry no personal data by design; please check before pasting anyway.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: This is not a security problem (those go through SECURITY.md).
          required: true
        - label: I searched the open issues.
          required: false
