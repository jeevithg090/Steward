# Local hooks use the tools installed by `make setup` (`uv run --no-sync`): a hook never changes
# the lockfile or the environment.
# gitleaks must be installed on your machine: `brew install gitleaks`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict on core and harness)
        entry: uv run --no-sync mypy
        language: system
        pass_filenames: false
        files: ^packages/(tempo_core|tempo_harness)/
      - id: pytest-fast
        name: pytest (unit, contract, policy)
        entry: uv run --no-sync pytest -m "unit or contract or policy" -x
        language: system
        pass_filenames: false
        types: [python]
