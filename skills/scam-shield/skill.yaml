id: scam-shield
name: Scam Shield
version: "0.3.0"
status: ready
summary: >-
  Tempo watches the texts that reach your phone and speaks when one is a trick. It checks the
  words, the links, the official registers and public phishing lists, and it never says "safe".
  It never moves your money.
jobs:
  - Watch incoming texts on your phone and say out loud, in your language, when one is a trick
  - Hold a doubtful link, look behind it from the Gateway, and then tell you what was found
  - Check who the firm really is against Companies House, the FCA Register and the FCA Warning List
  - Check a message you forward by SMS, read out on the phone line, or paste on the web
  - Before you pay someone new, ask who, how much and why, then say pay, wait or stop
  - Keep a log of what it checked, never a word of the message, and learn only from what you give it
needs: []
channels: [sms, web, voice]
docs: docs/scam-shield.md
notes: >-
  Recorded register, phishing-list and sandbox answers are used until keys are set and
  TEMPO_MODE=live. The text model is trained on two CC BY 4.0 SMS corpora plus a declared synthetic
  set; its numbers are in docs/scam_backtest.md. The Android node is written but not compiled here.
maintainers: [tempo-team]
