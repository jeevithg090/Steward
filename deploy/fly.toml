# Fly.io config for Tempo's Gateway (SHIPPING.md §5; the walkthrough is docs/deploy.md).
#
# Run flyctl from the repo root, so the build context is the whole repository (the Dockerfile
# copies skills/, fixtures/ and alembic/), and point it at this file:
#
#   fly launch --copy-config --config deploy/fly.toml --no-deploy   # once: name and region
#   fly volumes create tempo_data --size 1 --config deploy/fly.toml # the disk behind /data
#   fly secrets set --config deploy/fly.toml \
#     TEMPO_API_TOKEN=<any long random string> \
#     WEB_ORIGINS=https://<your-vercel-host> \
#     MESH_RP_ID=<your-vercel-host> \
#     PUBLIC_URL=https://<app-name>.fly.dev
#   fly deploy --config deploy/fly.toml
#
# `dockerfile` is resolved relative to this file (flyctl joins it with the config's directory),
# which is why it reads "gateway.Dockerfile" and not "deploy/gateway.Dockerfile".
#
# Secrets never go in [env]. Besides the four above, add when you have them (see .env.example):
#   DATABASE_URL (then run the migration once: fly ssh console --config deploy/fly.toml
#     -C "/app/.venv/bin/alembic -c /app/alembic.ini upgrade head"; or uncomment [deploy] below),
#   ELEVENLABS_*, VOICE_TOOL_SECRET, TWILIO_*, SNOWFLAKE_ACCOUNT, SNOWFLAKE_PAT, GEMINI_API_KEY,
#   RTT_TOKEN, HSP_*, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, VAPID_SUBJECT, MANDATE_SIGNING_KEY,
#   COMPANIES_HOUSE_API_KEY, FCA_API_EMAIL, FCA_API_KEY, LANGFUSE_*.
#
# The image runs as uid 10001 and does not create /data. If the first deploy's log shows a
# PermissionError on /data/checkpoints or /data/mesh.json, make the volume writable once:
#   fly ssh console --config deploy/fly.toml -C "chown 10001 /data"
# and restart the Machine.

app = "tempo-gateway" # placeholder: `fly launch` replaces it with the name you pick
primary_region = "lhr" # London; the people Tempo serves are in the UK

[build]
  dockerfile = "gateway.Dockerfile"

# [deploy]
#   release_command = "/app/.venv/bin/alembic -c /app/alembic.ini upgrade head"  # once DATABASE_URL is a secret

[env]
  TEMPO_MODE = "replay"          # live once vendor keys are in
  TEMPO_DEPLOY = "cloud-standard"
  TEMPO_REGION = "lhr"           # shown as is on /health
  TEMPO_DEMO = "1"               # the honesty badge and the /demo routes; "0" for anything real
  PAYMENT_CHECK_AFTER_S = "10"   # demo pace; the default is a week (604800)
  # CHECKPOINT_DIR=/data/checkpoints and MESH_FILE=/data/mesh.json come from the image.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # the Gateway runs a scheduler and holds WebSockets: keep it up
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "tempo_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"               # the Gateway builds in about 140 MB in replay mode (measured 25 Oct 2026)
  cpu_kind = "shared"
  cpus = 1
