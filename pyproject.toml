[project]
name = "tempo"
version = "0.1.0"
description = "Tempo: an open-source AI agent that values your time"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tempo-core",
    "tempo-ports",
    "tempo-adapters",
    "tempo-harness",
    "tempo-missions",
    "tempo-memory",
    "tempo-crypto",
    "tempo-mcp-rail",
    "tempo-mcp-mail",
    "tempo-mcp-calendar",
    "tempo-mcp-bank",
    "tempo-gateway",
    "tempo-worker",
    "tempo-passport",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "mcp-servers/*", "apps/gateway", "apps/worker"]

[tool.uv.sources]
tempo-core = { workspace = true }
tempo-ports = { workspace = true }
tempo-adapters = { workspace = true }
tempo-harness = { workspace = true }
tempo-missions = { workspace = true }
tempo-memory = { workspace = true }
tempo-crypto = { workspace = true }
tempo-mcp-rail = { workspace = true }
tempo-mcp-mail = { workspace = true }
tempo-mcp-calendar = { workspace = true }
tempo-mcp-bank = { workspace = true }
tempo-gateway = { workspace = true }
tempo-worker = { workspace = true }
tempo-passport = { workspace = true }

[dependency-groups]
dev = [
    "cryptography>=45",
    "httpx>=0.28",
    "hypothesis>=6.170",
    "mypy>=1.18",
    "pillow>=11.3",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
    "syrupy>=5.0",
    "testcontainers[postgres]>=4.15.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
# S = bandit security rules
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# Typographic characters we use on purpose in user-facing text.
allowed-confusables = ["–", "→", "×", "·", "➖"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on purpose and use fixed fake values.
"tests/**" = ["S101", "S105", "S106", "E501"]  # long rows keep policy tables readable
# The look-alike table is made of confusable characters on purpose: that is what it detects.
"packages/tempo_core/src/tempo_core/links.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "tempo_core",
    "tempo_ports",
    "tempo_adapters",
    "tempo_harness",
    "tempo_missions",
    "tempo_memory",
    "tempo_crypto",
    "tempo_mcp_rail",
    "tempo_mcp_mail",
    "tempo_mcp_calendar",
    "tempo_mcp_bank",
    "tempo_gateway",
    "tempo_worker",
    "tempo_passport",
]

[tool.mypy]
strict = true
python_version = "3.12"
packages = [
    "tempo_core",
    "tempo_harness",
    "tempo_memory",
    "tempo_crypto",
    "tempo_passport",
    "tempo_mcp_mail",
    "tempo_mcp_calendar",
    "tempo_mcp_bank",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure domain logic, including property tests (ms)",
    "contract: adapters against recorded fixtures (ms)",
    "policy: harness interceptors, table-driven (ms)",
    "workflow: MAF workflows with fakes (s)",
    "integration: gateway + Postgres via testcontainers or CI services (s)",
    "e2e: Playwright end-to-end (10s)",
    "eval: LLM quality, costs tokens (min)",
    "live: real vendor smoke tests, one call each (s)",
]
addopts = "-q --strict-markers --import-mode=importlib"
filterwarnings = [
    # Agent Hooks is experimental by design; ADR 0001 records why we use it anyway.
    "ignore:.*create_agent_hooks_middleware is experimental:Warning",
]

[tool.coverage.run]
branch = true
source_pkgs = [
    "tempo_core",
    "tempo_ports",
    "tempo_adapters",
    "tempo_harness",
    "tempo_missions",
    "tempo_memory",
    "tempo_crypto",
    "tempo_mcp_rail",
    "tempo_gateway",
    "tempo_worker",
    "tempo_passport",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
