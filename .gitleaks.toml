# gitleaks: the default rules, minus the fake secrets Steward's own tests are built on.
#
# Each allowlisted value below is a deliberate fake or a published test vector. They have to look
# like secrets: the outbound check, the secret box and the phone app's crypto are tested against
# them. Allowlist an exact value, never a whole test folder, so a real key that lands in the same
# file is still caught. Real keys live outside the repository (STEWARD_ENV_FILE).
#
#   gitleaks git --log-opts="--all" .

title = "Steward"

[extend]
useDefault = true

# Key shapes the default rules miss when they sit in code, JSON or YAML under a neutral name: the
# model providers Steward runs on, and Steward's own phone tokens. The outbound check knows the same
# shapes (packages/gateway/src/outbound.ts); keep the two lists in step.

[[rules]]
id = "nvidia-api-key"
description = "NVIDIA API key"
regex = '''\bnvapi-[A-Za-z0-9_-]{40,}'''
# A random key scores 4.4 or more; a slug such as nvapi-docs-getting-started-… scores under 4.
entropy = 4.2
keywords = ["nvapi-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-f0-9]{64}\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\bxai-[A-Za-z0-9]{40,}'''
keywords = ["xai-"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{40,}'''
keywords = ["gsk_"]

[[rules]]
id = "steward-device-token"
description = "Steward phone token"
regex = '''\bstw_dev_[A-Za-z0-9_-]{40,}'''
entropy = 4.2
keywords = ["stw_dev_"]

[[allowlists]]
description = "Published crypto test vectors: RFC 7748 §6.1, NaCl's own tests, Happy's key tree"
paths = ['''^packages/remote/src/vectors\.ts$''']

[[allowlists]]
description = "Fake key-shaped values the outbound check, the record and the secret box are tested on"
regexTarget = "match"
regexes = [
  '''ghp_aBcDeF1234567890aBcDeF1234567890abcd''',
  '''api_key=a1b2c3d4e5f6''',
  '''Bearer abcDEF123456ghiJKL789''',
  '''sk-or-v1-0123456789abcdef0123456789abcdef''',
  '''xoxb-1234567890-abcdefghij''',
  '''correct-horse-battery-9137''',
  # One fake per key shape the outbound check knows (packages/gateway/test/outbound.test.ts).
  '''nvapi-FAKEfake0123456789FAKEfake0123456789FAKEfake01''',
  '''xai-FAKEfake0123456789FAKEfake0123456789FAKEfake01''',
  '''gsk_FAKEfake0123456789FAKEfake0123456789FAKEfake01''',
  '''hf_FAKEfakeFAKEfakeFAKEfakeFAKEfake''',
  '''glpat-FAKEfake0123456789ab''',
  '''npm_FAKEfake0123456789FAKEfake0123456789''',
  '''stw_dev_FAKEfake0123456789FAKEfake0123456789fakeFAK''',
  '''https://hooks.slack.com/services/TFAKE0000/BFAKE0000/FAKEfake0123456789''',
  # RFC 6455 §1.3's sample Sec-WebSocket-Key ("the sample nonce").
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
