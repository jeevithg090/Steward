# GitLab CI/CD for Tempo (build plan S0.2).
# Unit, contract, policy and workflow jobs need no secrets: they run on recorded fixtures.
stages: [lint, test, e2e, security]

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

default:
  image: ghcr.io/astral-sh/uv:0.13.1-python3.12-trixie-slim
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen
  interruptible: true            # auto-cancel superseded pipelines (saves CI minutes)

workflow:
  rules:                         # run for MRs and main, not duplicate branch pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-type:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy

unit-contract-policy-workflow:
  stage: test
  script:
    - uv run pytest -m "unit or contract or policy or workflow" --junitxml=report.xml --cov --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

integration:
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: neo4j:5.26
      alias: neo4j
  variables:
    POSTGRES_DB: tempo
    POSTGRES_USER: tempo
    POSTGRES_PASSWORD: tempo
    DATABASE_URL: postgresql+asyncpg://tempo:tempo@postgres:5432/tempo
    TEST_DATABASE_URL: postgresql+asyncpg://tempo:tempo@postgres:5432/tempo
    NEO4J_AUTH: neo4j/tempo-ci-password
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: tempo-ci-password
  script:
    - if [ -f alembic.ini ]; then uv run alembic upgrade head; fi
    # pytest exits 5 when no integration tests exist yet; that is not a failure.
    - rc=0; uv run pytest -m integration --junitxml=report.xml || rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]
  artifacts:
    when: always
    reports: { junit: report.xml }

web:
  stage: test
  image: node:22
  rules:
    - exists: [apps/web/package.json]
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  before_script: [corepack enable, cd apps/web, pnpm install --frozen-lockfile]
  script: [pnpm typecheck, pnpm test, pnpm build]

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.48.0-jammy   # match your @playwright/test version
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [tests/e2e/package.json]
  before_script: [corepack enable, cd tests/e2e, pnpm install --frozen-lockfile]
  script: [pnpm playwright test]
  artifacts:
    when: on_failure
    paths: [tests/e2e/playwright-report/]

secrets:
  stage: security
  image: { name: zricethezav/gitleaks:v8.30.1, entrypoint: [""] }
  variables:
    GIT_DEPTH: 0                 # scan every commit, not just the shallow clone
  before_script: []
  cache: []
  script:
    - gitleaks git --redact --no-banner --verbose .
