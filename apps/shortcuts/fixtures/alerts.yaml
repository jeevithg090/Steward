    We're sorry to tell you that your 17:42 Great Western Railway service from Oxford to London Paddington on Friday 23 October has been cancelled.

    You may be entitled to compensation through the train company's Delay Repay scheme. Your ticket is still valid on the next available service.

    The Trainline team
  expect:
