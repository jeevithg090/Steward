# Sample delay alerts for Delay Spotter. All synthetic: written in the style of UK operator texts,
# Trainline emails and app notifications, not copied from real messages.
#
# channel: sms | email | notification. For an email the shortcut sees "<subject>\n<body>", which
# is what the Email automation passes on (see the README).
# received: when the message arrived. The shortcut uses it as the travel date when the text
# doesn't give one, just as the phone uses the current date.
# expect.outcome:
#   send        - all fields found; the shortcut POSTs them to the Gateway
#   short_delay - under 15 minutes: stops quietly, nothing leaves the phone
#   unreadable  - a delay, but the journey can't be read: one notification, nothing sent
#   ignored     - not about a delay: stops quietly
# expect.gateway: what the replay Gateway (`uv run tempo-gateway`) should answer for a `send`.
#   Replay mode knows only the journeys in fixtures/rail/replay (OXF -> PAD on 22 and 23 Oct).
# model_line: a plausible reply from the optional on-device "Use Model" step (simulated here;
#   the script can't run Apple's model). The shortcut puts it in front of the original text.

- id: gwr-sms-0812-delayed
  channel: sms
  sender: GWR
  received: "2026-10-23T08:19:00+01:00"
  text: >-
    GWR: We're sorry, the 08:12 Oxford to London Paddington is delayed by approximately 38
    minutes due to a signalling fault at Didcot Parkway. You may be able to claim Delay Repay at
    gwr.com/delayrepay
  model_line: "08:12 Oxford to London Paddington, 38 min late"
  expect:
    outcome: send
    departure: "08:12"
    origin: Oxford
    destination: London Paddington
    origin_crs: OXF
    destination_crs: PAD
    travel_date: "2026-10-23"
    short_delay_minutes: null
    gateway: {state: awaiting_consent, amount_gbp: "14.20"}

