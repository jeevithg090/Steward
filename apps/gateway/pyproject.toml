[project]
name = "tempo-gateway"
version = "0.1.0"
description = "Tempo's Gateway: REST, webhooks (ElevenLabs, Twilio) and live WebSocket updates"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tempo-core",
    "tempo-ports",
    "tempo-adapters",
    "tempo-harness",  # the profile guards on the workflows' claim path (missions.py)
    "tempo-missions",
    "tempo-memory",
    "tempo-crypto",
    "tempo-passport",  # Agent Passport: signed mandates (P2)
    "tempo-mcp-mail",  # Connectors (plan.md §14): the read-only servers the sweep starts over stdio
    "tempo-mcp-calendar",
    "tempo-mcp-bank",
    "mcp>=2.3",  # Tempo as an MCP server at /mcp, and the connectors' client (mcp_server.py, connectors.py)
    "fastapi>=0.162",
    "python-multipart>=0.0.32",
    "structlog>=25.4",
    "twilio>=9.12",
    "webauthn>=3.0.1",  # passkeys (py_webauthn)
    "pywebpush>=2.5.0",  # Web Push, VAPID
    "segno>=1.6.6",  # QR codes for pairing
    "uvicorn[standard]>=0.54",  # [standard] brings the WebSocket support /events needs
]

[project.scripts]
tempo-gateway = "tempo_gateway.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
