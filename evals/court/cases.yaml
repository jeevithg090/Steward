# Consensus Court eval (S6.1): eligibility questions that need interpretation.
# Pass bars: agreement >= 80%; never wrong when the three jurors are unanimous.
# Expected answers follow the published scheme rules and well-known UK261 case law; a team member
# should re-check them before quoting the results.
- id: dr-clear-38
  rule_id: uk-rail.gwr.delay-repay
  rule_text: "Delay Repay: if your train arrives 15 minutes or more late, you can claim compensation."
  facts: { arrival_delay_min: 38, ticket: "Off-Peak Day Single" }
  question: "Is this journey covered by Delay Repay?"
  expected_eligible: true
- id: dr-below-threshold
  rule_id: uk-rail.gwr.delay-repay
  rule_text: "Delay Repay: if your train arrives 15 minutes or more late, you can claim compensation."
  facts: { arrival_delay_min: 9 }
  question: "Is this journey covered by Delay Repay?"
  expected_eligible: false
- id: dr-cancelled-next-train
  rule_id: uk-rail.gwr.delay-repay
  rule_text: "Delay Repay: if your train is cancelled, or arrives 15 minutes or more late, you can claim. A cancelled train counts by how late you reached your destination."
  facts: { scheduled_service: cancelled, arrived_on_next_train_min_late: 55 }
  question: "Is this journey covered by Delay Repay?"
  expected_eligible: true
- id: dr-weather-still-pays
  rule_id: uk-rail.gwr.delay-repay
  rule_text: "Delay Repay applies whatever the cause of the delay, including weather and incidents outside our control."
  facts: { arrival_delay_min: 31, cause: "flooding near Didcot" }
  question: "Does the cause stop this claim?"
  expected_eligible: true
- id: uk261-technical-fault
  rule_id: uk261.delay
  rule_text: "Compensation is not payable if the delay was caused by extraordinary circumstances which could not have been avoided even if all reasonable measures had been taken."
  facts: { arrival_delay_min: 245, airline_reason: "unexpected technical fault with the aircraft" }
  question: "Is the passenger owed compensation, or were these extraordinary circumstances?"
  expected_eligible: true
