[project]
name = "tempo-mcp-calendar"
version = "0.1.0"
description = "MCP connector: list the events in a folder of .ics calendars, read-only"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3"]

[project.scripts]
tempo-mcp-calendar = "tempo_mcp_calendar.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
